# 안드로이드 테스트 APK 빌드 (고닷 4.7.2 C#, 비밀값 필요 없음)
# 결과
# - 릴리스 test-latest: 폰에서 바로 받는 APK
# (아티팩트는 쓰지 않는다. 계정 저장 공간 한도를 다른 레포와 같이 쓴다)
# - 브랜치 ci-build: APK와 화면 사진 (Claude가 git으로 받아 화면을 확인한다)

name: 안드로이드 테스트 빌드

on:
  push:
    branches-ignore:
      - ci-build
    paths:
      - 'core/**'
      - 'godot/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  core:
    name: 코어 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 코어 빌드와 테스트
        run: dotnet test core/Hanjeopsi.sln

  android:
    name: APK 빌드
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 고닷 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-mono

      - name: 고닷과 내보내기 템플릿 받기 (공식 배포판)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o editor.zip "$base/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q editor.zip && unzip -q templates.tpz && rm editor.zip templates.tpz
          ls -la ~/godot

      - name: 고닷 준비
        run: |
          GODOT=$(find ~/godot -maxdepth 2 -type f -name "Godot_v*_mono_linux.x86_64" | head -1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$tpl" && cp -r ~/godot/templates/* "$tpl/"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres
          "$GODOT" --version
          ls "${ANDROID_SDK_ROOT}/build-tools"

      - name: 그림 가져오기와 C# 빌드
        run: |
          "$GODOT" --headless --path godot --import
          dotnet build godot/Hanjeopsi.csproj

      - name: 화면 사진 (가상 화면)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p shots
          for mode in lab checks; do
            extra=""; [ "$mode" = checks ] && extra="--shot-checks"
            timeout 180 xvfb-run -a -s "-screen 0 1080x1920x24" \
              "$GODOT" --path godot --rendering-driver opengl3 --resolution 1080x1920 -- --shot="$PWD/shots/$mode.png" $extra
          done
          ls -la shots

      - name: APK 내보내기
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/godot/keystore/ci-test.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: hanjeopsi
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: hanjeopsi-test
        run: |
          mkdir -p godot/build
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.3.${{ github.run_number }}\"/" godot/export_presets.cfg
          "$GODOT" --headless --path godot --export-release "Android" build/hanjeopsi.apk
          ls -la godot/build
          # 내보내기는 C# 오류가 나도 "경고"로 끝난다. 게임 코드가 APK에 들었는지 직접 확인한다
          unzip -l godot/build/hanjeopsi.apk | grep -E "Hanjeopsi(\.Core)?\.dll|GodotSharp\.dll" || { echo "::error::APK에 C# 어셈블리가 없다. 내보내기 로그의 ERROR를 본다"; exit 1; }
          cp godot/build/hanjeopsi.apk "hanjeopsi-${{ github.run_number }}.apk"

      - name: 테스트 빌드 릴리스 갱신 (폰에서 받기)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest --cleanup-tag --yes || true
          gh release create test-latest "hanjeopsi-${{ github.run_number }}.apk" shots/lab.png \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "테스트 빌드 #${{ github.run_number }}" \
            --notes "브랜치 ${{ github.ref_name }} · 커밋 ${{ github.sha }}. 테스트 키로 서명해서 다음 빌드도 덮어 설치된다."

      - name: 결과를 ci-build 브랜치에 (Claude 확인용)
        run: |
          mkdir out && cp "hanjeopsi-${{ github.run_number }}.apk" out/hanjeopsi.apk && cp shots/*.png out/
          echo "빌드 #${{ github.run_number }} · ${{ github.ref_name }} · ${{ github.sha }}" > out/BUILD.txt
          cd out
          git init -q && git checkout -q -b ci-build
          git add . && git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "빌드 #${{ github.run_number }} (${{ github.sha }})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-build
