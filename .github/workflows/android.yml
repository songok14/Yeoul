# 안드로이드 테스트 APK 빌드 (GameCI, 무료)
# 필요한 저장소 비밀값: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD  (docs/UNITY_PLAN.md 10장)
# 결과: Actions 실행 화면의 apk 아티팩트, 그리고 릴리스 "test-latest"(폰에서 바로 받기)

name: 안드로이드 테스트 빌드

on:
  push:
    paths:
      - 'unity/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.27f1
  PROJECT_PATH: unity/HanjeopsiBada

jobs:
  core:
    name: 코어 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 코어 빌드와 테스트
        run: dotnet test unity/dotnet/Hanjeopsi.sln
      - name: 유니티 코드 점검 컴파일
        run: dotnet build unity/dotnet/UnityCheck

  android:
    name: APK 빌드
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 유니티 라이선스 비밀값 확인
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::저장소 비밀값 UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD 가 필요하다. docs/UNITY_PLAN.md 10-2 를 따라 넣는다."
            exit 1
          fi

      - name: 디스크 비우기 (유니티 이미지가 크다)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Library 캐시
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/HanjeopsiBada/Assets/**', 'unity/HanjeopsiBada/Packages/**', 'unity/com.songok.hanjeopsi.core/**', 'unity/com.songok.hanjeopsi.game/**') }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-

      - name: 유니티 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: hanjeopsi
          buildMethod: Hanjeopsi.EditorTools.BuildScript.BuildAndroid
          versioning: None
          androidExportType: androidPackage

      - name: APK 이름 붙이기
        run: |
          ls -la build/Android
          cp build/Android/hanjeopsi.apk "hanjeopsi-${{ github.run_number }}.apk"

      - name: 아티팩트 올리기
        uses: actions/upload-artifact@v4
        with:
          name: hanjeopsi-apk-${{ github.run_number }}
          path: hanjeopsi-${{ github.run_number }}.apk
          retention-days: 14

      - name: 테스트 빌드 릴리스 갱신 (폰에서 받기)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest --cleanup-tag --yes || true
          gh release create test-latest "hanjeopsi-${{ github.run_number }}.apk" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "테스트 빌드 #${{ github.run_number }}" \
            --notes "브랜치 ${{ github.ref_name }} · 커밋 ${{ github.sha }}. 테스트 서명이라 같은 키로 덮어 설치된다."
