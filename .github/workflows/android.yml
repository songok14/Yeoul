# 안드로이드 테스트 APK 빌드 (고닷 4.7.2 C#, 비밀값 필요 없음)
# 결과
# - 릴리스 test-latest: 폰에서 바로 받는 APK
# (아티팩트는 쓰지 않는다. 계정 저장 공간 한도를 다른 레포와 같이 쓴다)
# - 브랜치 ci-build: APK와 화면 사진 (Claude가 git으로 받아 화면을 확인한다)

name: 안드로이드 테스트 빌드

on:
  push:
    branches-ignore:
      - ci-build
    paths:
      - 'core/**'
      - 'godot/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  core:
    name: 코어 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 코어 빌드와 테스트
        run: dotnet test core/Hanjeopsi.sln

  android:
    name: APK 빌드
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 고닷 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-mono

      - name: 고닷과 내보내기 템플릿 받기 (공식 배포판)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o editor.zip "$base/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q editor.zip && unzip -q templates.tpz && rm editor.zip templates.tpz
          ls -la ~/godot

      - name: 고닷 준비
        run: |
          GODOT=$(find ~/godot -maxdepth 2 -type f -name "Godot_v*_mono_linux.x86_64" | head -1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$tpl" && cp -r ~/godot/templates/* "$tpl/"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres
          "$GODOT" --version
          ls "${ANDROID_SDK_ROOT}/build-tools"

      - name: 그림 가져오기와 C# 빌드
        run: |
          "$GODOT" --headless --path godot --import
          dotnet build godot/Hanjeopsi.csproj

      - name: 화면 사진 (가상 화면)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          sed -i "s/^config\/version=.*/config\/version=\"0.3.${{ github.run_number }}\"/" godot/project.godot
          mkdir -p shots
          # 이름:인자. 화면을 새로 만들면 여기에 한 줄 더한다
          shots=(
            "lab:--screen=lab"
            "checks:--screen=lab --shot-checks"
            "title:--screen=title"
            "title-ending:--screen=title --demo=ending"
            "town:--screen=town"
            "town-restaurant:--screen=town --shot-action=restaurant"
            "town-goals:--screen=town --shot-action=goals"
            "town-paid:--screen=town --shot-action=paid"
            "town-late:--screen=town --shot-action=late"
            "town-summary:--screen=town --demo=summary"
            "town-evening:--screen=town --demo=evening --shot-action=yeoul"
            "town-rain:--screen=town --demo=evening --weather=rain"
            "town-rain-dusk:--screen=town --demo=evening --weather=rain-dusk"
            "town-dawn:--screen=town --demo=summary"
            "town-lunch:--screen=town --demo=lunch"
            "town-night:--screen=town --demo=night"
            "town-snow:--screen=town --demo=lunch --weather=snow"
            "town-snow-night:--screen=town --demo=night --weather=snow"
            "town-typhoon:--screen=town --demo=lunch --weather=typhoon"
            "town-typhoon-night:--screen=town --demo=night --weather=typhoon"
            "town-fog:--screen=town --demo=summary --weather=fog"
            "town-fog-night:--screen=town --demo=night --weather=fog"
            "town-tall:--screen=town --demo=evening"
            "talk-welcome:--screen=town --shot-action=welcome"
            "talk-clear:--screen=town --demo=evening --shot-action=clear"
            "fishing:--screen=fishing"
            "fishing-power:--screen=fishing --shot-action=power"
            "fishing-reel:--screen=fishing --demo=evening --shot-action=reel"
            "fishing-result:--screen=fishing --shot-action=result"
            "fishing-new:--screen=fishing --shot-action=new"
            "fishing-pull:--screen=fishing --demo=evening --shot-action=pull"
            "fishing-joy:--screen=fishing --shot-action=joy"
            "fishing-big:--screen=fishing --demo=evening --shot-action=big"
            "fishing-jump:--screen=fishing --shot-action=jump"
            "fishing-leap:--screen=fishing --shot-action=leap"
            "fishing-thief:--screen=fishing --shot-action=thief"
            "fishing-run:--screen=fishing --demo=evening --shot-action=run"
            "fishing-night:--screen=fishing --demo=night --shot-action=reel"
            "fishing-snow:--screen=fishing --demo=lunch --weather=snow --shot-action=reel"
            "fishing-wait:--screen=fishing --demo=lunch --shot-action=wait"
            "fishing-gear-wait:--screen=fishing --demo=gear --shot-action=wait"
            "fishing-gear-power:--screen=fishing --demo=gear --shot-action=power"
            "fishing-gear-reel:--screen=fishing --demo=gear --shot-action=reel"
            "fishing-gear-bite:--screen=fishing --demo=gear --shot-action=bite"
            "fishing-bite:--screen=fishing --demo=lunch --shot-action=bite"
            "fishing-rain:--screen=fishing --demo=lunch --weather=rain --shot-action=wait"
            "fishing-fog:--screen=fishing --weather=fog --shot-action=wait"
            "town-rain-night:--screen=town --demo=night --weather=rain"
            "fishing-snow-night:--screen=fishing --demo=night --weather=snow --shot-action=reel"
            "fishing-tutorial:--screen=fishing --tutorial"
            "fishing-tutorial-catch:--screen=fishing --tutorial --shot-action=tutorialCatch"
            "story-p1:--screen=story --shot-action=p1:0"
            "story-ash:--screen=story --shot-action=p1:1"
            "story-phone:--screen=story --shot-action=p1:2"
            "story-hands:--screen=story --shot-action=p1:4"
            "story-notice:--screen=story --shot-action=p1:5"
            "story-memory:--screen=story --shot-action=p1:7"
            "story-salt:--screen=story --shot-action=p2:salt"
            "story-cat:--screen=story --shot-action=p2:3:cat"
            "story-clear:--screen=story --shot-action=clear:1"
            "story-fail:--screen=story --shot-action=fail:0"
            "story-tall:--screen=story --shot-action=p1:9"
            "story-walk:--screen=story --shot-action=p1:walk"
            "fishing-tall:--screen=fishing --demo=summary"
            "market:--screen=market"
            "market-auction:--screen=market --shot-action=auction"
            "town-quest:--screen=town --shot-action=quest"
            "town-quest-talk:--screen=town --shot-action=questTalk"
            "story-catfloat:--screen=town --shot-action=catFloat"
            "story-nossinote:--screen=town --shot-action=nossiNote"
            "story-sera:--screen=town --shot-action=seraMeet"
            "story-seraduel:--screen=town --shot-action=seraDuel"
            "market-tall:--screen=market --demo=summary"
            "shop:--screen=shop"
            "shop-talk:--screen=shop --shot-action=talk"
            "shop-keep:--screen=shop --shot-action=keep"
            "shop-bait:--screen=shop --shot-action=bait"
            "shop-gift:--screen=shop --shot-action=gift"
            "shop-tall:--screen=shop --demo=evening"
            "notebook:--screen=notebook"
            "notebook-dex:--screen=notebook --shot-action=dex"
            "notebook-detail:--screen=notebook --shot-action=detail"
            "notebook-taste:--screen=notebook --shot-action=taste"
            "notebook-journal:--screen=notebook --shot-action=journal"
            "notebook-settings:--screen=notebook --shot-action=settings"
            "notebook-quest:--screen=notebook --shot-action=quest"
            "truck:--screen=truck"
            "truck-grill:--screen=truck --shot-action=grill"
            "truck-cook:--screen=truck --shot-action=cook"
            "truck-good:--screen=truck --shot-action=good"
            "truck-bad:--screen=truck --demo=evening --shot-action=bad"
            "truck-end:--screen=truck --shot-action=end"
            "truck-rankup:--screen=truck --shot-action=rankup"
            "truck-regular:--screen=truck --shot-action=regular"
            "truck-boy:--screen=truck --demo=evening --shot-action=boy"
            "truck-tall:--screen=truck --demo=evening"
          )
          for s in "${shots[@]}"; do
            name="${s%%:*}"; args="${s#*:}"
            res=1080x1920; case "$name" in *-tall) res=1080x2400;; esac
            timeout 180 xvfb-run -a -s "-screen 0 ${res}x24" \
              "$GODOT" --path godot --rendering-driver opengl3 --resolution $res -- --shot="$PWD/shots/$name.png" $args
          done
          ls -la shots

      - name: APK 내보내기
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/godot/keystore/ci-test.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: hanjeopsi
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: hanjeopsi-test
        run: |
          mkdir -p godot/build
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.3.${{ github.run_number }}\"/" godot/export_presets.cfg
          "$GODOT" --headless --path godot --export-release "Android" build/hanjeopsi.apk
          ls -la godot/build
          # 내보내기는 C# 오류가 나도 "경고"로 끝난다. 게임 코드가 APK에 들었는지 직접 확인한다
          unzip -l godot/build/hanjeopsi.apk | grep -E "Hanjeopsi(\.Core)?\.dll|GodotSharp\.dll" || { echo "::error::APK에 C# 어셈블리가 없다. 내보내기 로그의 ERROR를 본다"; exit 1; }
          cp godot/build/hanjeopsi.apk "hanjeopsi-${{ github.run_number }}.apk"

      - name: 테스트 빌드 릴리스 갱신 (폰에서 받기)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest --cleanup-tag --yes || true
          gh release create test-latest "hanjeopsi-${{ github.run_number }}.apk" shots/title.png shots/town.png \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "테스트 빌드 #${{ github.run_number }}" \
            --notes "브랜치 ${{ github.ref_name }} · 커밋 ${{ github.sha }}. 테스트 키로 서명해서 다음 빌드도 덮어 설치된다."

      - name: 결과를 ci-build 브랜치에 (Claude 확인용)
        run: |
          mkdir out && cp shots/*.png out/
          # GitHub 파일 한도(100MB) 때문에 APK는 쪼개서 올린다. 합치기: cat hanjeopsi.apk.part-* > hanjeopsi.apk
          split -b 90m "hanjeopsi-${{ github.run_number }}.apk" out/hanjeopsi.apk.part-
          echo "빌드 #${{ github.run_number }} · ${{ github.ref_name }} · ${{ github.sha }}" > out/BUILD.txt
          cd out
          git init -q && git checkout -q -b ci-build
          git add . && git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "빌드 #${{ github.run_number }} (${{ github.sha }})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-build
